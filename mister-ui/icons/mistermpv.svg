<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>misterMPV</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d67a0"/>
      <stop offset="1" stop-color="#43375e"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.42" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#0b0d16"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b56ae0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b56ae0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.28"/>
    </pattern>
    <clipPath id="screen"><rect x="44" y="94" width="122" height="102" rx="20"/></clipPath>
  </defs>
  <!-- rabbit-ear antenna -->
  <g stroke="#8a76ad" stroke-width="7" stroke-linecap="round">
    <line x1="128" y1="70" x2="86" y2="20"/>
    <line x1="128" y1="70" x2="176" y2="16"/>
  </g>
  <circle cx="86" cy="20" r="7" fill="#c9a3e6"/>
  <circle cx="176" cy="16" r="7" fill="#c9a3e6"/>
  <ellipse cx="128" cy="72" rx="20" ry="9" fill="#5a4a78"/>
  <!-- cabinet -->
  <rect x="22" y="72" width="212" height="148" rx="26" fill="url(#body)" stroke="#1d1629" stroke-width="6"/>
  <!-- feet -->
  <rect x="52" y="218" width="28" height="16" rx="5" fill="#1d1629"/>
  <rect x="176" y="218" width="28" height="16" rx="5" fill="#1d1629"/>
  <!-- screen bezel + glass -->
  <rect x="36" y="86" width="138" height="118" rx="26" fill="#1d1629"/>
  <rect x="44" y="94" width="122" height="102" rx="20" fill="url(#glass)"/>
  <g clip-path="url(#screen)">
    <circle cx="105" cy="145" r="52" fill="url(#glow)"/>
    <!-- mpv-style play disc -->
    <circle cx="105" cy="145" r="34" fill="#6a1d8a"/>
    <circle cx="105" cy="145" r="25" fill="#8d3bb3"/>
    <circle cx="105" cy="145" r="17" fill="#e9dcf2"/>
    <path d="M99 135 L117 145 L99 155 Z" fill="#6a1d8a"/>
    <rect x="44" y="94" width="122" height="102" fill="url(#scan)"/>
    <!-- glass reflection -->
    <path d="M52 104 Q60 98 92 98 Q70 104 58 126 Z" fill="#ffffff" fill-opacity="0.18"/>
  </g>
  <!-- control panel -->
  <circle cx="204" cy="112" r="13" fill="#c9a3e6" stroke="#1d1629" stroke-width="4"/>
  <line x1="204" y1="112" x2="204" y2="101" stroke="#1d1629" stroke-width="4" stroke-linecap="round"/>
  <circle cx="204" cy="148" r="10" fill="#c9a3e6" stroke="#1d1629" stroke-width="4"/>
  <line x1="204" y1="148" x2="211" y2="142" stroke="#1d1629" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#1d1629">
    <rect x="190" y="172" width="28" height="4" rx="2"/>
    <rect x="190" y="180" width="28" height="4" rx="2"/>
    <rect x="190" y="188" width="28" height="4" rx="2"/>
  </g>
</svg>
